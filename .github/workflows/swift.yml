name: Swift

on: [push]

jobs:
  mac:
    name: macOS
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Swift Version
      run: swift --version
    - name: Build (Debug)
      run: swift build -c debug
    - name: Build (Release)
      run: swift build -c release
    - name: Test (Debug)
      run: swift test --configuration debug

  linux:
    name: Linux
    strategy:
      matrix:
        swift: ["6.0", "6.1"]
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Swift Version
      run: swift --version
    - name: Build (Debug)
      run: swift build -c debug
    - name: Build (Release)
      run: swift build -c release
    - name: Test (Debug)
      run: swift test --configuration debug

  embedded:
    name: Embedded Swift
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Swift Version
      run: swift --version
    - name: Build (ARMv7-M bare metal)
      run: SWIFTPM_ENABLE_MACROS=0 swift build --target TLVCoding --triple armv7em-none-none-eabi -Xswiftc -enable-experimental-feature -Xswiftc Embedded -Xswiftc -wmo
