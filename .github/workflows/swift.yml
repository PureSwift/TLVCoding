name: Swift

on: [push]

jobs:
  mac:
    name: macOS
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Swift Version
      run: swift --version
    - name: Build (Debug)
      run: swift build -c debug
    - name: Build (Release)
      run: swift build -c release
    - name: Test (Debug)
      run: swift test --configuration debug

  coverage:
    name: Code Coverage
    runs-on: macos-latest
    permissions:
      contents: read
      code-quality: write # required by actions/upload-code-coverage
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Swift Version
      run: swift --version
    - name: Export coverage and enforce threshold
      run: Scripts/coverage.sh 70
    - name: Upload coverage to GitHub Code Quality
      uses: actions/upload-code-coverage@v1
      with:
        file: .build/coverage/coverage.xml
        language: Swift
        label: code-coverage/llvm-cov
        # Code Quality was in public preview until 2026-07-20; keep this while
        # the repo might not have the feature enabled, so a failed upload
        # doesn't break CI. Remove once GA is enabled everywhere.
        fail-on-error: false
    - name: Upload coverage artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage
        path: .build/coverage/
        if-no-files-found: error

  linux:
    name: Linux
    strategy:
      matrix:
        swift: [6.3.3]
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Swift Version
      run: swift --version
    - name: Build (Debug)
      run: swift build -c debug
    - name: Build (Release)
      run: swift build -c release
    - name: Test (Debug)
      run: swift test --configuration debug
